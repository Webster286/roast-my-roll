<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roast my roll – gratis im App Store</title>
<meta name="description" content="roast my roll – deine Galerie, gnadenlos geroastet. Gratis im App Store.">
<meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/roast-my-roll/id6830547374">
<style>
html,body{margin:0;background:#111;color:#F4F1EA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:480px;margin:0 auto;padding:56px 20px;text-align:center}
.brand{display:flex;justify-content:center;gap:8px;margin-bottom:28px}
.chip{font-weight:800;font-size:28px;padding:2px 12px 6px;border-radius:12px;color:#111}
.c1{background:#D7FF3A;transform:rotate(-3deg)}.c2{background:#FF3D7F;transform:rotate(2deg)}.c3{background:#2B3BFF;color:#fff;transform:rotate(-1deg)}
.cta{display:block;background:#D7FF3A;color:#111;font-weight:800;font-size:1.3rem;padding:20px;border-radius:16px;text-decoration:none;margin:24px 0 12px}
p{opacity:.75;font-size:.9rem;line-height:1.5}
</style>
<script>location.replace('https://apps.apple.com/app/roast-my-roll/id6830547374');</script>
</head>
<body>
<main>
  <div class="brand"><span class="chip c1">roast</span><span class="chip c2">my</span><span class="chip c3">roll.</span></div>
  <a class="cta" href="https://apps.apple.com/app/roast-my-roll/id6830547374">Gratis im App Store laden</a>
  <p id="msg">Du wirst gleich weitergeleitet. Klappt nicht? Tippe oben rechts auf <strong>⋯</strong> → <strong>Im Browser öffnen</strong>.</p>
</main>
<script>
if (!/^de/i.test(navigator.language || '')) {
  document.documentElement.lang = 'en';
  document.querySelector('.cta').textContent = 'Get it free on the App Store';
  document.getElementById('msg').innerHTML = 'Redirecting you now. Not working? Tap <strong>⋯</strong> in the top right → <strong>Open in browser</strong>.';
}
</script>
</body>
</html>
